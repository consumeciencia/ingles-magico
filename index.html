<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inglés Mágico">
<meta name="theme-color" content="#0d0633">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Inglés Mágico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Patrick+Hand&family=Cinzel:wght@600;800&family=Cormorant+Garamond:wght@500;700&family=Playfair+Display:wght@600;800&family=Bodoni+Moda:wght@600;800&family=Nunito:wght@500;800&display=swap" rel="stylesheet">
<style>
/* VOICE: juguetón y ruidoso para Alex y Luc; épico y elegante para el adulto.
   IDEA: un videojuego de verdad — una isla que crece (niños) y un reino que conquistas (adulto).
   PICTURE: la isla viva con Bip, el robot-dino; el mapa del reino con tu dragón.
   COLOUR and TYPE: 5 skins por perfil vía variables; Fredoka / Patrick Hand para niños, Cinzel / Playfair / Bodoni para adultos.
   LAYOUT: pensado para iPad — dos columnas en horizontal, una en vertical; botones de 56px o más. */
:root{color-scheme:light dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.45 var(--fb);overflow-x:clip;-webkit-user-select:none;user-select:none;transition:background .4s}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--a3);outline-offset:3px}
h1,h2,h3{font-family:var(--fh);line-height:1.08;margin:0;text-wrap:balance}
#app{min-height:100dvh}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}

/* ---------- SKINS NIÑOS ---------- */
.skin-neon{--bg:#0d0633;--bg2:#24106e;--ink:#fff;--card:#2a1680;--line:#4a2cc0;--a1:#ff2bd6;--a2:#19e3ff;--a3:#c6ff00;--dark:#07021c;--fh:'Fredoka',system-ui;--fb:'Fredoka',system-ui;--rad:26px;--sky1:#3b0f8c;--sky2:#ff5fc8;--sea:#11c5e6;--sand:#ffd35c}
.skin-selva{--bg:#0e4a2e;--bg2:#1f7a4a;--ink:#fffbe6;--card:#17623c;--line:#2e8f59;--a1:#ffb703;--a2:#ff7b00;--a3:#9ef01a;--dark:#062615;--fh:'Fredoka',system-ui;--fb:'Fredoka',system-ui;--rad:28px;--sky1:#7fd1ff;--sky2:#d6ffb0;--sea:#2bb3a3;--sand:#f2c46d}
.skin-galaxia{--bg:#05051a;--bg2:#1c1450;--ink:#eef0ff;--card:#191548;--line:#352d8c;--a1:#8a63ff;--a2:#00e5ff;--a3:#ffd60a;--dark:#020210;--fh:'Fredoka',system-ui;--fb:'Fredoka',system-ui;--rad:24px;--sky1:#050420;--sky2:#5b2bb5;--sea:#3a5bff;--sand:#c9b6ff}
.skin-caramelo{--bg:#ffe6f0;--bg2:#ffd3b0;--ink:#3a1d4a;--card:#fff;--line:#ffc2d6;--a1:#ff4f8b;--a2:#2fb8cc;--a3:#ffbf3c;--dark:#d9346c;--fh:'Fredoka',system-ui;--fb:'Fredoka',system-ui;--rad:30px;--sky1:#9fe3ff;--sky2:#ffd6ea;--sea:#5fd3e6;--sand:#ffe08a}
.skin-papel{--bg:#e6d5b1;--bg2:#d8c194;--ink:#2b2118;--card:#fdf7e8;--line:#2b2118;--a1:#e4572e;--a2:#2a9d8f;--a3:#f2b21b;--dark:#2b2118;--fh:'Patrick Hand',cursive;--fb:'Patrick Hand',cursive;--rad:8px;--sky1:#9fd3e6;--sky2:#fbe9c2;--sea:#4aa3b5;--sand:#e9c983;
  background-image:repeating-linear-gradient(17deg,rgba(80,50,20,.05) 0 2px,transparent 2px 7px),repeating-linear-gradient(-71deg,rgba(255,255,255,.12) 0 1px,transparent 1px 9px)}
.skin-papel .card,.skin-papel .zone,.skin-papel .ex,.skin-papel .go,.skin-papel .opt,.skin-papel .tile,.skin-papel .door,.skin-papel .island,.skin-papel .bar,.skin-papel .lbar,.skin-papel .rcard{border:2.5px solid var(--line)!important;box-shadow:4px 5px 0 rgba(43,33,24,.28)!important;border-radius:6px 10px 7px 12px/10px 6px 12px 7px!important}
.skin-papel .zone:nth-child(odd),.skin-papel .ex:nth-child(odd),.skin-papel .opt:nth-child(odd),.skin-papel .door:nth-child(odd){rotate:-1.4deg}
.skin-papel .zone:nth-child(even),.skin-papel .ex:nth-child(even),.skin-papel .opt:nth-child(even),.skin-papel .door:nth-child(even){rotate:1.2deg}

/* ---------- SKINS ADULTO ---------- */
.skin-dragon{--bg:#120a0a;--bg2:#2a0f12;--ink:#f3e7cf;--card:#1e1313;--line:#5a3a1c;--a1:#c9a227;--a2:#8b1e2d;--a3:#e8641a;--dark:#070303;--fh:'Cinzel',serif;--fb:'Cormorant Garamond',serif;--rad:10px}
.skin-rosa{--bg:#fff1f3;--bg2:#fbd6de;--ink:#4a1426;--card:#fff;--line:#f1b6c5;--a1:#d6336c;--a2:#b8892a;--a3:#f783ac;--dark:#8f1d45;--fh:'Playfair Display',serif;--fb:'Nunito',system-ui;--rad:18px}
.skin-trattoria{--bg:#fbf3e2;--bg2:#f0dfbd;--ink:#2a1a12;--card:#fffdf7;--line:#e2c79a;--a1:#b91c1c;--a2:#166534;--a3:#d97706;--dark:#7f1010;--fh:'Playfair Display',serif;--fb:'Nunito',system-ui;--rad:12px;
  background-image:conic-gradient(rgba(185,28,28,.07) 25%,transparent 0 50%,rgba(185,28,28,.07) 0 75%,transparent 0);background-size:56px 56px}
.skin-pasarela{--bg:#0b0b0b;--bg2:#1b1b1b;--ink:#fafafa;--card:#151515;--line:#333;--a1:#ff3d8b;--a2:#f5f5f5;--a3:#bfbfbf;--dark:#000;--fh:'Bodoni Moda',serif;--fb:'Nunito',system-ui;--rad:2px}
.skin-cuna{--bg:#f4f1ea;--bg2:#dfe9df;--ink:#2f3a33;--card:#fff;--line:#d5ddd2;--a1:#6f9f80;--a2:#f0a080;--a3:#f2cf6b;--dark:#3f6b50;--fh:'Nunito',system-ui;--fb:'Nunito',system-ui;--rad:24px}

/* ---------- BASE ---------- */
.icon{width:56px;height:56px;border-radius:50%;background:var(--card);font-size:26px;display:grid;place-items:center;box-shadow:0 4px 0 var(--dark);flex:none}
.icon:active{transform:translateY(3px);box-shadow:0 1px 0 var(--dark)}
.ghost{padding:12px 20px;border-radius:999px;border:2px solid var(--line);font-weight:600}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.card{background:var(--card);border-radius:var(--rad);padding:20px}
.toast{position:fixed;left:50%;top:18px;translate:-50% 0;z-index:95;background:var(--a3);color:#1a1a1a;padding:14px 24px;border-radius:999px;font:700 20px var(--fh);box-shadow:0 8px 30px rgba(0,0,0,.3);animation:toastIn .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes toastIn{from{translate:-50% -120px;scale:.6}}
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:20px}
.modal .card{max-width:620px;width:100%;max-height:90dvh;overflow:auto;animation:popIn .4s cubic-bezier(.2,1.6,.4,1);position:relative}
.modal h3{font-size:28px;margin-bottom:12px}
.x{position:absolute;right:12px;top:12px}
@keyframes popIn{from{scale:.4;opacity:0}}
.shake{animation:shake .45s}
@keyframes shake{20%{translate:-8px 0}40%{translate:8px 0}60%{translate:-5px 4px}80%{translate:5px -3px}}

/* ---------- HOME ---------- */
.home{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:30px 16px;text-align:center;
  background:radial-gradient(circle at 20% 10%,var(--a1) 0,transparent 35%),radial-gradient(circle at 85% 80%,var(--a2) 0,transparent 35%),var(--bg)}
.logo{font-size:clamp(46px,9vw,96px);color:#fff;text-shadow:0 6px 0 var(--dark)}
.logo span{display:inline-block;animation:wave 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*.08s);color:hsl(calc(var(--i)*30 + var(--h,0)) 100% 65%)}
@keyframes wave{0%,100%{translate:0 0}50%{translate:0 -14px}}
.sub{font-size:24px;margin:0;font-weight:600}
.pick{display:grid;grid-template-columns:repeat(3,minmax(0,220px));gap:22px}
.door{background:var(--card);border-radius:30px;padding:26px 14px 20px;display:grid;justify-items:center;gap:6px;box-shadow:0 10px 0 var(--dark);animation:bob 3s ease-in-out infinite;animation-delay:var(--d,0s);transition:transform .15s}
.door:active{transform:translateY(6px) scale(.97)}
.door .av{font-size:84px;line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
.door b{font:700 32px var(--fh)}
.door.adult{background:linear-gradient(160deg,#2a0f12,#120a0a);color:#f3e7cf;border:2px solid #c9a227;font-family:'Cinzel',serif}
.door.adult b{font-family:'Cinzel',serif}
@keyframes bob{50%{translate:0 -10px}}
@media(max-width:640px){.pick{grid-template-columns:1fr 1fr}.door.adult{grid-column:1/-1}}

/* ---------- KID HUB ---------- */
.kidhub{min-height:100dvh;padding:14px 14px 104px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-rows:auto 1fr;gap:16px;
  background:radial-gradient(circle at 90% 0,var(--bg2),transparent 55%),var(--bg)}
.bar{grid-column:1/-1;display:flex;align-items:center;gap:14px;background:var(--card);border-radius:var(--rad);padding:10px 14px;flex-wrap:wrap}
.me{display:flex;align-items:center;gap:10px;flex:1}
.me b{font:700 26px var(--fh);display:block}
.me small{opacity:.85}
.av.big{font-size:46px;display:inline-block;animation:wobble 3s ease-in-out infinite}
@keyframes wobble{25%{rotate:-8deg}75%{rotate:8deg}}
.week{background:var(--bg);padding:8px 14px;border-radius:999px;font-weight:600;font-size:15px}
.island{position:relative;border-radius:var(--rad);overflow:hidden;min-height:420px;background:linear-gradient(var(--sky1),var(--sky2) 62%);animation:hue 18s linear infinite}
@keyframes hue{50%{filter:hue-rotate(25deg) saturate(1.15)}}
.sea{position:absolute;left:0;right:0;bottom:0;height:38%;background:var(--sea);overflow:hidden}
.sea::before{content:"";position:absolute;left:-10%;right:-10%;top:-14px;height:28px;background:radial-gradient(circle at 20px 0,transparent 15px,var(--sea) 16px) 0 0/40px 28px repeat-x;animation:waves 3s linear infinite}
@keyframes waves{to{translate:40px 0}}
.sand{position:absolute;left:8%;right:8%;bottom:9%;height:36%;background:radial-gradient(ellipse at 50% 40%,color-mix(in srgb,var(--sand),#fff 25%),var(--sand) 60%);border-radius:50%;box-shadow:0 10px 0 rgba(0,0,0,.12)}
.thing{position:absolute;font-size:38px;line-height:1;transition:transform .2s;filter:drop-shadow(0 4px 0 rgba(0,0,0,.18))}
.thing:active,.thing.boing{animation:boing .5s}
@keyframes boing{30%{transform:scale(1.4) rotate(-10deg)}60%{transform:scale(.9) rotate(6deg)}}
.thing small{position:absolute;right:-8px;bottom:-4px;font:700 11px var(--fb);background:#fff;color:#222;border-radius:9px;padding:1px 5px}
.cloud{animation:drift 26s linear infinite}
@keyframes drift{from{translate:-120px 0}to{translate:calc(100vw) 0}}
.fish{animation:swim 9s ease-in-out infinite}
@keyframes swim{50%{translate:120px -8px;scale:-1 1}}
.bip{position:absolute;left:4%;bottom:6%;width:132px;z-index:3;animation:bob 2.6s ease-in-out infinite}
.bip.jump{animation:bipjump .7s}
@keyframes bipjump{40%{translate:0 -60px;rotate:-12deg}}
.blink{animation:blinkA 1.2s steps(2) infinite}
@keyframes blinkA{50%{opacity:.3}}
.eye{animation:eyes 4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes eyes{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.bubble{position:absolute;left:4%;bottom:calc(6% + 150px);max-width:min(330px,80%);background:#fff;color:#222;border-radius:20px;padding:12px 16px;font-weight:600;z-index:4;box-shadow:0 6px 0 rgba(0,0,0,.15);animation:popIn .35s cubic-bezier(.2,1.6,.4,1)}
.bubble::after{content:"";position:absolute;left:44px;bottom:-14px;border:8px solid transparent;border-top:14px solid #fff}
.bubble small{display:block;opacity:.7;font-weight:500;margin-top:4px}
.side{display:flex;flex-direction:column;gap:14px}
.zones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.zone{border-radius:var(--rad);padding:16px 8px 14px;display:grid;justify-items:center;gap:2px;font-size:52px;line-height:1;color:#fff;box-shadow:0 7px 0 var(--dark);transition:transform .15s,filter .3s}
.zone b{font:700 22px var(--fh);margin-top:6px}
.zone small{font-size:13px;opacity:.95;line-height:1.2;text-align:center}
.lvl{grid-column:1/-1;font:700 17px var(--fh);opacity:.9}
.zone:nth-child(3n+2){background:linear-gradient(160deg,var(--a1),color-mix(in srgb,var(--a1),#000 25%))}
.zone:nth-child(3n+3){background:linear-gradient(160deg,var(--a2),color-mix(in srgb,var(--a2),#000 25%))}
.zone:nth-child(3n+4){background:linear-gradient(160deg,var(--a3),color-mix(in srgb,var(--a3),#000 30%));color:#1d1d1d}
.zone:active,.ex:active,.go:active{transform:translateY(5px);box-shadow:0 2px 0 var(--dark)}
.breathe{animation:breathe 2.8s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes breathe{50%{scale:1.05}}
.hop{animation:hop .9s cubic-bezier(.3,1.8,.5,1)!important}
@keyframes hop{30%{translate:0 -34px;rotate:-6deg}60%{translate:0 0;rotate:4deg}80%{translate:0 -10px}}
.go{background:linear-gradient(var(--a3),color-mix(in srgb,var(--a3),#000 22%));color:#1a1a1a;font:700 30px var(--fh);padding:18px;border-radius:var(--rad);box-shadow:0 8px 0 var(--dark);width:100%}
.extras{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ex{background:var(--card);border-radius:var(--rad);padding:16px 12px;font:600 19px var(--fh);box-shadow:0 6px 0 var(--dark);position:relative;transition:transform .15s,background .3s}
.ex:hover{background:var(--line)}
.badge{position:absolute;right:-6px;top:-6px;background:var(--a1);color:#fff;border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font-size:15px;animation:breathe 1s infinite}
.hiding{animation:hide 3.4s ease-in-out!important}
@keyframes hide{10%{scale:.1;rotate:200deg;opacity:0}85%{scale:.1;rotate:200deg;opacity:0}100%{scale:1;opacity:1}}
.coop{background:var(--card);border-radius:var(--rad);padding:12px 16px;font-size:15px}
.coop b{font-family:var(--fh);font-size:18px}
.meter{height:14px;border-radius:9px;background:var(--bg);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3));border-radius:9px;transition:width .6s}
.sur{position:fixed;z-index:60;width:96px;height:96px;border-radius:50%;font-size:52px;background:conic-gradient(var(--a3) calc(var(--p)*1%),rgba(255,255,255,.25) 0);display:grid;place-items:center;box-shadow:0 0 0 6px #fff,0 10px 30px rgba(0,0,0,.4);animation:popIn .4s cubic-bezier(.2,1.6,.4,1),spinS 1.2s ease-in-out infinite alternate}
@keyframes spinS{to{rotate:14deg;scale:1.08}}
.sur span{position:absolute;bottom:-28px;font:700 16px var(--fh);color:var(--ink);white-space:nowrap}
@media(max-width:860px){.kidhub{grid-template-columns:1fr}.island{min-height:360px}}

/* play automático */
.play{display:grid;justify-items:center;gap:4px;font-size:44px;padding:22px 18px;position:relative;overflow:hidden}
.play small{font:600 16px var(--fb)}
.play::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);translate:-100% 0;animation:shine 2.6s ease-in-out infinite}
@keyframes shine{60%,100%{translate:100% 0}}
.trail{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:30px 16px;background:radial-gradient(circle at 50% 70%,var(--bg2),var(--bg) 70%)}
.trail h1{font-size:clamp(34px,6vw,60px)}
.path{position:relative;display:flex;gap:clamp(12px,4vw,44px);align-items:center;padding:78px 10px 14px}
.path::before{content:"";position:absolute;left:40px;right:40px;top:calc(78px + clamp(35px,6vw,55px));border-top:6px dashed var(--line);z-index:0}
.stop{position:relative;z-index:1;width:clamp(70px,12vw,110px);aspect-ratio:1;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:clamp(34px,6vw,54px);box-shadow:0 7px 0 var(--dark)}
.stop.done{background:#22c55e}
.stop.done::after{content:"✓";position:absolute;right:-4px;top:-4px;width:34px;height:34px;border-radius:50%;background:#fff;color:#15803d;font:800 22px var(--fh);display:grid;place-items:center}
.stop.cur{background:var(--a3);animation:breathe 1s ease-in-out infinite}
.stop.chest{background:linear-gradient(var(--a1),var(--a2))}
.walker{position:absolute;top:0;font-size:clamp(46px,7vw,64px);line-height:1;translate:-50% 0;transition:left 1.3s cubic-bezier(.4,1.5,.5,1);z-index:2;animation:bob .6s ease-in-out infinite}
.count{font:800 clamp(90px,16vw,150px)/1 var(--fh);color:var(--a3);text-shadow:0 8px 0 var(--dark);min-height:1em}
.count span{display:inline-block;animation:popIn .5s cubic-bezier(.2,1.6,.4,1)}
.autochip{font:700 15px var(--fb);background:var(--a3);color:#1a1a1a;padding:6px 12px;border-radius:999px;white-space:nowrap}
.next.auto{position:relative;overflow:hidden}
.next.auto::after{content:"";position:absolute;left:0;bottom:0;height:6px;width:100%;background:var(--a1);transform-origin:left;animation:fillT var(--t) linear forwards}
@keyframes fillT{from{transform:scaleX(0)}}
/* tabs */
.tabs{position:fixed;left:50%;bottom:12px;translate:-50% 0;z-index:50;display:flex;gap:6px;background:var(--card);padding:8px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.35);border:2px solid var(--line)}
.tabs button{display:grid;justify-items:center;padding:6px 16px;border-radius:999px;font-size:26px;line-height:1;min-width:78px}
.tabs button small{font:600 13px var(--fb);margin-top:3px}
.tabs button.on{background:var(--a1);color:#fff}

/* ---------- LESSON ---------- */
.lesson{min-height:100dvh;display:flex;flex-direction:column;max-width:860px;margin:0 auto;padding:14px 16px}
.lbar{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:999px;padding:6px 14px 6px 6px}
.prog{flex:1;height:22px;background:var(--bg);border-radius:12px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--a3));border-radius:12px;transition:width .5s cubic-bezier(.2,1.4,.4,1);position:relative}
.prog i::after{content:"";position:absolute;inset:4px 10px auto;height:5px;border-radius:3px;background:rgba(255,255,255,.45)}
.combo{font:700 22px var(--fh);min-width:56px;text-align:right}
.lbody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:28px 0}
.lbody h2{font-size:clamp(26px,4vw,38px)}
.phrase{font:700 clamp(26px,4.2vw,40px) var(--fh);background:var(--card);border-radius:var(--rad);padding:18px 22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hint{margin:-10px 0 0;opacity:.8;font-size:19px}
.spk{width:54px;height:54px;border-radius:50%;background:var(--a2);color:#fff;font-size:26px;flex:none;box-shadow:0 4px 0 var(--dark)}
.bigspk{width:130px;height:130px;border-radius:50%;background:var(--a2);font-size:60px;box-shadow:0 8px 0 var(--dark);align-self:center;animation:breathe 2s infinite}
.slow{align-self:center;font-size:22px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.opts.pics{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt{background:var(--card);border:3px solid var(--line);border-radius:var(--rad);padding:18px;font:600 22px var(--fb);text-align:center;box-shadow:0 6px 0 var(--dark);transition:transform .12s}
.opt.pic{font-size:72px;line-height:1.1;padding:22px 10px}
.opt:active{transform:translateY(4px)}
.opt.right{background:#22c55e;border-color:#15803d;color:#fff;animation:boing .5s}
.opt.wrong{background:#ef4444;border-color:#b91c1c;color:#fff;animation:shake .4s}
.kara .kw{transition:color .2s,scale .2s;display:inline-block}
.kara .kw.lit{color:var(--a3);scale:1.15;text-shadow:0 3px 0 var(--dark)}
.blank{display:inline-block;min-width:90px;border-bottom:5px solid var(--a1);color:transparent}
.slots{min-height:88px;border-bottom:3px dashed var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 0}
.tiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.tile{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:12px 18px;font:600 22px var(--fb);box-shadow:0 5px 0 var(--dark);animation:popIn .3s}
.tile.used{visibility:hidden}
.revtag{align-self:flex-start;background:var(--a3);color:#1a1a1a;font:700 17px var(--fh);padding:6px 14px;border-radius:999px;animation:popIn .4s}
.bigemoji{font-size:130px;line-height:1;text-align:center;animation:bob 2.4s infinite}
.sayit{border:4px dashed var(--a3);position:relative}
.sayit span{flex:1}
.howto{position:absolute;inset:0;z-index:6;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;padding:24px;background:color-mix(in srgb,var(--bg),transparent 8%)}
.howto .hbig{font-size:110px;line-height:1;animation:bob 2s infinite}
.howto h2{font-size:clamp(30px,5vw,46px)}
.howto p{font-size:23px;max-width:620px;margin:0;line-height:1.35}
.howto .tnote{font-size:18px;opacity:.85}
.holes{position:absolute;inset:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.hole{position:relative;overflow:hidden;border-radius:24px;background:radial-gradient(ellipse 42% 16% at 50% 84%,#1a0e05 0 98%,transparent 100%),color-mix(in srgb,var(--bg2),#000 15%)}
.mole{position:absolute;left:50%;bottom:12%;font-size:clamp(60px,9vw,96px);line-height:1;translate:-50% 130%;transition:translate .25s cubic-bezier(.3,1.6,.5,1)}
.mole.up{translate:-50% 0}
.modesw{grid-column:1/-1;display:flex;gap:6px;background:var(--card);padding:6px;border-radius:999px}
.modesw button{flex:1;padding:12px;border-radius:999px;font:800 18px var(--fh)}
.modesw button.on{background:var(--a1);color:#fff}
.zone.locked{filter:grayscale(1);opacity:.45}
.rtext{font:800 clamp(30px,5vw,48px)/1.3 var(--fh);background:var(--card);border-radius:var(--rad);padding:20px 24px;text-align:center;letter-spacing:.02em}
.rtext.big{font-size:clamp(54px,10vw,92px);letter-spacing:.06em}
.sy.s0{color:var(--a1)}.sy.s1{color:var(--a2)}
.skin-caramelo .sy.s0,.skin-papel .sy.s0{color:#c0264e}.skin-caramelo .sy.s1,.skin-papel .sy.s1{color:#1b6e7a}
.rw{border-radius:10px;padding:0 4px;transition:background .3s}
.rw.okw{background:#22c55e;color:#fff}.rw.okw .sy{color:#fff}
.rw.badw{background:#ef4444;color:#fff}.rw.badw .sy{color:#fff}
.bigletter{font:800 160px/1 var(--fh);text-align:center;color:var(--a3);text-shadow:0 8px 0 var(--dark)}
.opts.letters{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt.rl{font:800 clamp(46px,8vw,72px)/1.1 var(--fh);padding:16px}
.opts.rwords .opt{font:800 clamp(26px,4vw,36px) var(--fh)}
.rtile{font:800 30px var(--fh)!important;padding:14px 22px!important}
.judge{display:grid;justify-items:center;gap:8px;opacity:.85;border-top:2px dashed var(--line);padding-top:12px}
.judge.hl{opacity:1;background:color-mix(in srgb,var(--a3),transparent 75%);border-radius:16px;padding:12px}
.story{background:var(--card);border-radius:var(--rad);padding:20px 26px;font:700 clamp(24px,3.6vw,32px)/1.5 var(--fh)}
.story h3{font-size:clamp(28px,4vw,38px);margin-bottom:8px}.story p{margin:6px 0}
.mini-st{font-size:20px;padding:10px 16px}.mini-st summary{cursor:pointer;font-weight:800}
.balloon.rb{color:#fff;font:800 30px var(--fh);display:grid;place-items:center;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.rfall{font:800 30px var(--fh)!important;background:var(--card);padding:10px 18px;border-radius:16px;box-shadow:0 5px 0 var(--dark)}
.rtarget{font-size:34px;color:var(--a3)}
.mole.word{font:800 clamp(24px,3.4vw,34px) var(--fh);background:var(--card);padding:8px 14px;border-radius:14px;white-space:nowrap}
.lfoot{min-height:110px;display:flex;align-items:center}
.check,.next{width:100%;padding:20px;border-radius:var(--rad);font:700 24px var(--fh);background:var(--a1);color:#fff;box-shadow:0 7px 0 var(--dark)}
.check:disabled{opacity:.4}
.fb{width:100%;display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 16px;padding:18px;border-radius:var(--rad);animation:slideUp .35s cubic-bezier(.2,1.5,.4,1)}
.fb.good{background:#22c55e;color:#fff}.fb.bad{background:#ef4444;color:#fff}
.fb b{font:700 28px var(--fh)}
.fb span{grid-column:1}
.fb .exp{font-size:21px;line-height:1.35;background:rgba(0,0,0,.18);border-radius:12px;padding:8px 12px}
.opt .cap{display:block;font:600 15px/1.25 var(--fb);margin-top:6px;opacity:.95}
.fb .next{grid-row:1/span 2;grid-column:2;width:auto;padding:18px 30px;background:#fff;color:#222}
@keyframes slideUp{from{translate:0 80px;opacity:0}}
.speakrow{display:flex;justify-content:center}
.mic{width:150px;height:150px;border-radius:50%;background:var(--a1);font:700 22px var(--fh);color:#fff;box-shadow:0 8px 0 var(--dark)}
.mic.rec{animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--a1),transparent 30%)}100%{box-shadow:0 0 0 40px transparent}}
#heard{text-align:center;min-height:26px}
.said{align-self:center;padding:16px 28px;font-size:20px}

/* ---------- MINIJUEGOS ---------- */
.mini{min-height:100dvh;display:flex;flex-direction:column;padding:14px}
.mbar{display:flex;gap:16px;align-items:center;justify-content:space-between;background:var(--card);border-radius:999px;padding:12px 22px;font:700 20px var(--fh)}
.arena{flex:1;position:relative;overflow:hidden;border-radius:var(--rad);margin-top:12px;background:linear-gradient(var(--bg2),var(--bg));min-height:420px;touch-action:none}
.mhelp{text-align:center;font:700 24px var(--fh);margin:12px 0 4px}
.intro{position:absolute;inset:0;display:grid;place-items:center;z-index:5;font:800 clamp(40px,8vw,80px) var(--fh);color:#fff;text-shadow:0 6px 0 var(--dark);animation:introZ 1.3s forwards;text-align:center}
@keyframes introZ{0%{scale:0;rotate:-20deg}30%{scale:1.2;rotate:5deg}45%{scale:1;rotate:0}85%{opacity:1}100%{opacity:0;scale:1.6}}
.floater{position:absolute;bottom:-120px;font-size:56px;line-height:1;animation:rise linear forwards}
.floater.fall{bottom:auto;top:-110px;animation-name:fallA}
@keyframes rise{to{translate:0 calc(-100vh - 140px)}}
@keyframes fallA{to{translate:0 calc(100vh + 140px)}}
.balloon{width:84px;height:102px;border:3px solid rgba(255,255,255,.85);-webkit-appearance:none;appearance:none;box-shadow:inset -8px -10px 0 rgba(0,0,0,.12),0 6px 14px rgba(0,0,0,.3);border-radius:50% 50% 46% 46%/55% 55% 45% 45%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.7) 0 8%,transparent 20%),var(--c)}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:50px;background:rgba(255,255,255,.6)}
.plate{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle,#fff 55%,#e8e2d6 56% 62%,#fff 63%);display:grid;place-items:center;box-shadow:0 8px 16px rgba(0,0,0,.3)}
.popped{animation:popped .2s forwards!important}
@keyframes popped{to{scale:1.8;opacity:0}}
.nope{filter:grayscale(1) brightness(.6)}
.mem{position:absolute;inset:10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.mc{perspective:600px;border-radius:16px}
.mc i{position:relative;display:block;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mc.on i,.mc.ok i{transform:rotateY(180deg)}
.mc em,.mc strong{position:absolute;inset:0;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;font-style:normal}
.mc em{background:linear-gradient(140deg,var(--a1),var(--a2));font-size:40px;box-shadow:0 5px 0 var(--dark)}
.mc strong{background:var(--card);transform:rotateY(180deg);font:700 clamp(18px,2.6vw,26px) var(--fh);border:3px solid var(--line);text-align:center;padding:4px}
.mc strong.e{font-size:clamp(40px,6vw,64px)}
.mc.ok strong{border-color:#22c55e;background:color-mix(in srgb,#22c55e,var(--card) 70%)}
.spellbox{position:absolute;top:18px;left:0;right:0;display:grid;justify-items:center;gap:10px;z-index:2}
.spellbox .big{font-size:76px;line-height:1}
.spellbox .rep{width:auto;height:auto;border-radius:999px;padding:10px 22px;font:700 20px var(--fh)}
.spellbox{grid-template-columns:auto auto;justify-content:center;align-items:center}.spellbox .big,.spellbox .slotsL{grid-column:1/-1;justify-self:center}
.slotsL{display:flex;gap:8px}
.slotsL span{width:52px;height:60px;border-radius:12px;border:3px dashed var(--line);display:grid;place-items:center;font:700 32px var(--fh);background:var(--card)}
.slotsL span.f{border-style:solid;border-color:var(--a3);animation:boing .4s}
.bub{position:absolute;width:76px;height:76px;border-radius:50%;font:700 34px var(--fh);color:#fff;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.8) 0 10%,transparent 25%),radial-gradient(circle,transparent 50%,var(--a2) 100%),color-mix(in srgb,var(--a2),transparent 55%);border:2px solid rgba(255,255,255,.7);animation:bobB 2.4s ease-in-out infinite;animation-delay:var(--d)}
@keyframes bobB{50%{translate:0 -18px}}

/* ---------- REWARD ---------- */
.reward{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:30px 16px;text-align:center;background:radial-gradient(circle,var(--bg2),var(--bg) 70%)}
.reward h1{font-size:clamp(40px,7vw,72px)}
.pop-in{animation:popIn .6s cubic-bezier(.2,1.6,.4,1)}
.chest{font-size:150px;line-height:1;animation:chestW 1s ease-in-out infinite;display:grid;justify-items:center}
.chest small{font:700 20px var(--fh)}
@keyframes chestW{25%{rotate:-7deg}75%{rotate:7deg}}
.loot{display:grid;grid-template-columns:repeat(2,minmax(0,240px));gap:14px}
.loot .l{background:var(--card);border-radius:var(--rad);padding:16px;display:grid;justify-items:center;gap:4px;animation:popIn .5s cubic-bezier(.2,1.6,.4,1) backwards}
.loot .l:nth-child(2){animation-delay:.15s}.loot .l:nth-child(3){animation-delay:.3s}.loot .l:nth-child(4){animation-delay:.45s}
.loot .l span{font-size:54px;line-height:1}
.loot .l b{font:700 22px var(--fh)}

/* ---------- KID SUBSCREENS ---------- */
.sub-screen{min-height:100dvh;padding:14px 14px 110px;max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.shead{display:flex;align-items:center;gap:14px}
.shead h2{font-size:clamp(28px,4vw,40px);flex:1}
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.stk div{aspect-ratio:1;background:var(--card);border-radius:var(--rad);display:grid;place-items:center;font-size:58px}
.stk div.lock{filter:grayscale(1) brightness(.3);opacity:.5}
.thread{display:flex;flex-direction:column;gap:10px;background:var(--card);border-radius:var(--rad);padding:16px;min-height:200px;max-height:42dvh;overflow:auto}
.msg{max-width:75%;padding:12px 16px;border-radius:20px;background:var(--bg2);font-size:20px;align-self:flex-start;text-align:left}
.msg.mine{align-self:flex-end;background:var(--a1);color:#fff}
.msg span{font-size:36px;margin-right:6px;vertical-align:middle}
.msg small{display:block;opacity:.75;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:12px 18px;border-radius:999px;background:var(--card);border:3px solid var(--line);font-weight:600;font-size:18px}
.chip.on{background:var(--a2);border-color:var(--a2);color:#fff}
.chip.e{font-size:30px;padding:6px 12px}
.duo{display:grid;gap:18px;justify-items:center;text-align:center}
.duo .turn{font:700 34px var(--fh)}
.duo .av{font-size:90px;line-height:1;animation:bob 2s infinite}
.score2{display:flex;gap:16px}
.score2 div{background:var(--card);border-radius:var(--rad);padding:12px 22px;font:700 22px var(--fh)}
.score2 .cur{outline:4px solid var(--a3)}
.big2{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.big2 button{padding:20px 30px;border-radius:var(--rad);font:700 24px var(--fh);box-shadow:0 7px 0 var(--dark)}
.yes{background:#22c55e;color:#fff}.again{background:var(--a3);color:#222}
.chatbox{display:flex;gap:10px}
.chatbox input{flex:1;font:20px var(--fb);padding:14px 18px;border-radius:999px;border:3px solid var(--line);background:var(--card);color:var(--ink);-webkit-user-select:text;user-select:text}

/* ---------- ADULT ---------- */
.onb{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;max-width:760px;margin:0 auto;padding:30px 18px;gap:22px}
.onb .step{font:600 14px var(--fb);opacity:.7;letter-spacing:.02em}
.onb h2{font-size:clamp(30px,5vw,46px)}
.onb .chip{font-size:19px;padding:14px 20px;border-radius:var(--rad)}
.onb input{font:22px var(--fb);padding:16px 18px;border-radius:var(--rad);border:2px solid var(--line);background:var(--card);color:var(--ink);-webkit-user-select:text;user-select:text}
.btnA{padding:18px 28px;border-radius:var(--rad);background:var(--a1);color:#fff;font:700 21px var(--fh);box-shadow:0 5px 0 var(--dark);letter-spacing:.02em}
.skin-pasarela .btnA{color:#000;background:var(--a2)}
.houses{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.house{background:var(--card);border:2px solid var(--line);border-radius:var(--rad);padding:18px;display:grid;justify-items:center;gap:4px;text-align:center}
.house span{font-size:64px;line-height:1}
.house b{font:700 21px var(--fh)}
.house i{opacity:.8}
.house.on{border-color:var(--a1);outline:3px solid var(--a1)}
.realm{min-height:100dvh;padding:14px 14px 110px;max-width:1240px;margin:0 auto;display:grid;gap:16px}
.rbar{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:10px 14px;flex-wrap:wrap}
.crest{font-size:46px;width:70px;height:70px;display:grid;place-items:center;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;background:linear-gradient(var(--a2),var(--dark));border:3px solid var(--a1)}
.rbar .who{flex:1}
.rbar b{font:700 24px var(--fh);display:block}
.xpw{min-width:220px}
.xpw .meter i{background:linear-gradient(90deg,var(--a2),var(--a1))}
.hero{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px}
.dragon{background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--a3),transparent 60%),transparent 60%),var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:20px;text-align:center;display:grid;gap:6px;justify-items:center}
.dragon .d{font-size:120px;line-height:1;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 10px 18px color-mix(in srgb,var(--a3),transparent 40%))}
.dragon b{font:700 22px var(--fh)}
.mission{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:24px;display:grid;gap:14px;align-content:center}
.mission h2{font-size:clamp(28px,4vw,42px)}
.mission p{margin:0;font-size:19px}
.regions{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:18px;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;transition:transform .2s,border-color .2s}
.rcard:hover{transform:translateY(-4px);border-color:var(--a1)}
.rcard span{font-size:52px;grid-row:span 3}
.rcard b{font:700 20px var(--fh)}
.rcard small{opacity:.8;font-size:15px}
.dots{display:flex;gap:5px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.f{background:var(--a1)}
.recr{border-color:var(--a1);box-shadow:0 0 0 2px var(--a1)}
.scroll{overflow-x:auto}
.ladder{display:grid;gap:10px}
.ladder div{display:flex;justify-content:space-between;gap:10px;padding:14px 18px;background:var(--card);border:1px solid var(--line);border-radius:var(--rad)}
.ladder .got{border-color:var(--a1)}
.ladder .no{opacity:.45}
.skins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:10px 0}
.sk{border-radius:16px;padding:14px;font:700 18px var(--fh);display:grid;gap:8px;text-align:left;border:3px solid transparent}
.sk.on{border-color:currentColor}
.sk i{display:flex;gap:4px}.sk i u{width:22px;height:22px;border-radius:50%;display:block}
.tip{background:color-mix(in srgb,var(--a3),transparent 75%);border:2px solid var(--a3);border-radius:14px;padding:12px 14px;margin:8px 0;line-height:1.4}
.vlist{display:grid;gap:8px;margin:10px 0}
.vrow{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:14px;background:var(--bg);flex-wrap:wrap}
.vrow.on{outline:3px solid var(--a1)}
.vrow span{flex:1;min-width:150px}.vrow small{display:block;opacity:.75}
.vrow button{padding:10px 14px;font-size:16px}
.avs{display:flex;flex-wrap:wrap;gap:8px}
.avs button{font-size:42px;width:70px;height:70px;border-radius:16px;background:var(--bg)}
.avs button.on{outline:4px solid var(--a1)}
table.par{width:100%;border-collapse:collapse;font-size:17px}
table.par td,table.par th{padding:10px;border-bottom:1px solid var(--line);text-align:left}
table.par td:not(:first-child){text-align:right}
.gate input{font:28px var(--fb);width:140px;padding:12px;border-radius:12px;border:2px solid var(--line);text-align:center;background:var(--bg);color:var(--ink);-webkit-user-select:text;user-select:text}
.adult .opt.pic{font-size:60px}
.skin-pasarela .tabs button.on{background:var(--a2);color:#000}
@media(max-width:760px){.hero{grid-template-columns:1fr}.loot{grid-template-columns:1fr 1fr}.tabs button{min-width:64px;padding:6px 10px}}
.dash{max-width:1100px;margin:0 auto;padding:16px 16px 40px;display:grid;gap:16px}
.dhead{display:flex;gap:14px;align-items:center}.dhead h1{font-size:clamp(30px,4vw,42px)}.dhead small{opacity:.7}
.dtabs{display:flex;gap:8px;flex-wrap:wrap}
.dtabs button{padding:12px 22px;border-radius:999px;background:var(--card);border:2px solid var(--line);font:800 19px var(--fh)}
.dtabs button.on{background:var(--dark);border-color:var(--dark);color:#fff}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:12px}
.dstat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:2px}
.dstat small{font-weight:700;opacity:.7}.dstat b{font:800 38px/1.1 var(--fh);font-variant-numeric:tabular-nums}.dstat span{opacity:.8;font-size:15px}
.dstat.big{background:var(--dark);color:#fff;border:0}.dstat.big .tbar{background:rgba(255,255,255,.25)}.dstat.big .tbar i{background:var(--a3)}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.dcard h3{font:800 21px var(--fh);margin:0 0 12px}.dcard h3 small{font-weight:500;opacity:.6;font-size:14px}
.dnote{margin:0;opacity:.75;font-size:15px}
.recs{list-style:none;margin:0;padding:0;display:grid;gap:10px}.recs li{display:flex;gap:12px;align-items:flex-start}.recs span{font-size:26px;line-height:1}.recs p{margin:0}
.chart{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;height:180px;align-items:end;padding-top:20px}
.chart .col{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;border-radius:6px;cursor:default}
.chart .col:hover{background:var(--bg)}
.chart .col i{display:block;width:70%;max-width:26px;min-height:0;background:var(--a1);border-radius:4px 4px 0 0}
.chart .col em{position:absolute;top:-4px;font:700 13px var(--fb);font-style:normal}
.chart .col small{font-size:12px;opacity:.7;text-transform:uppercase}
.trow{display:grid;grid-template-columns:40px minmax(0,200px) minmax(0,1fr) 54px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border:0}.trow.lock{opacity:.5}.te{font-size:28px}.tn{font-weight:800}.tn small{display:block;font-weight:500;opacity:.7}

function vScore(v,lang){
  const n=v.name||'';let sc=0;
  if(NOVELTY.test(n))sc-=200;
  if(/premium/i.test(n))sc+=120;
  if(/enhanced|mejorad|améliorée/i.test(n))sc+=90;
  if(/neural|natural|siri/i.test(n))sc+=80;
  if(/^(ava|zoe|samantha|allison|evan|nathan|joelle|noelle|tom|susan|serena|karen|daniel|moira|tessa|paulina|mónica|monica|jorge|diego|juan|marisol)\b/i.test(n))sc+=20;
  if(v.lang===lang)sc+=15;else if(v.lang&&v.lang.replace('_','-').startsWith(lang.slice(0,2)))sc+=5;else sc-=500;
  if(/google/i.test(n))sc+=40;
  if(v.localService)sc+=3;
  return sc;
}
const vLabel=v=>(/premium/i.test(v.name)?'⭐ Premium':/enhanced|mejorad/i.test(v.name)?'✨ Mejorada':'Básica');
function bestVoice(lang){
  const pref=S.voice&&S.voice[lang.slice(0,2)];
  if(pref){const v=voices.find(v=>v.voiceURI===pref||v.name===pref);if(v)return v}
  return voices.filter(v=>v.lang).map(v=>[vScore(v,lang),v]).filter(x=>x[0]>-100).sort((a,b)=>b[0]-a[0]).map(x=>x[1])[0]||null;
}

let ac=null;
function tone(f,d=.12,type='sine',v=.15,delay=0){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.03)}catch(e){}
}

const cv=$('#fx'),cx=cv.getContext('2d');let P=[],raf=0;
function fit(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',fit);fit();
function loop(){
  cx.clearRect(0,0,innerWidth,innerHeight);P=P.filter(p=>p.life>0&&p.y<innerHeight+80);
  for(const p of P){p.vy+=p.g;p.vx*=p.drag;p.vy*=p.drag;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;
    cx.save();cx.globalAlpha=Math.min(1,p.life/30);cx.translate(p.x,p.y);cx.rotate(p.r);
    if(p.t){cx.font=p.s+'px serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(p.t,0,0)}
    else if(p.circle){cx.fillStyle=p.c;cx.beginPath();cx.arc(0,0,p.s/2,0,7);cx.fill()}
    else{cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2)}
    cx.restore()}
  raf=P.length?requestAnimationFrame(loop):0;
}
function add(p){if(P.length>700)return;P.push(Object.assign({x:0,y:0,vx:0,vy:0,g:.15,drag:.99,r:0,vr:(Math.random()-.5)*.3,life:120,s:10,c:'#fff'},p));if(!raf)raf=requestAnimationFrame(loop)}

function startLesson(o){
  const pool=o.pool,who=o.who;
  const st=who==='kid'?S.kids[kid]:S.adult;const l1=who==='kid'?level1(st):st.done<5;const basic=!!B[o.zone];
  const kn=new Set(st.known||[]),wk=new Set((st.weak||[]).map(x=>x.k));
  const pd=shuf(pool.phrases);let pi=0,wi=0;
  const wd=shuf(pool.words).sort((a,b)=>(wk.has(b[1])-wk.has(a[1]))||(kn.has(a[1])-kn.has(b[1])));
  const nP=(f=()=>true)=>{for(let t=0;t<pd.length;t++){const p=pd[pi++%pd.length];if(f(p))return p}return pd[0]};
  const nW=()=>wd[wi++%wd.length];
  const toks=s=>s.split(' ');
  const allToks=[...new Set(pool.phrases.flatMap(p=>toks(p[0])))];
  const nOpt=basic?2:3;
  const make=t=>{
    if(t==='pic'||t==='hear'){const w=nW();return{t,w,opts:shuf([w,...shuf(pool.words.filter(x=>x!==w)).slice(0,nOpt)])}}
    if(t==='word'){const w=nW();return{t,w,opts:shuf([w,...shuf(pool.words.filter(x=>x!==w)).slice(0,2)]).map(x=>x[1])}}
    if(t==='speakw'){const w=nW();return{t:'speak',w,en:w[1],es:wes(w[1])}}
    if(t==='listen'){const p=nP();return{t,ans:p[0],es:p[1],opts:shuf([p[0],...shuf(pool.phrases.filter(x=>x!==p)).slice(0,who==='kid'?2:3).map(x=>x[0])])}}
    if(t==='meaning'){const p=nP();return{t,en:p[0],ans:p[1],opts:shuf([p[1],...shuf(pool.phrases.filter(x=>x!==p)).slice(0,who==='kid'?2:3).map(x=>x[1])])}}
    if(t==='build'||t==='build0'){const p=nP(x=>toks(x[0]).length<=(t==='build0'?4:8)&&toks(x[0]).length>=2);const tk=toks(p[0]);const set=new Set(tk.map(norm));
      const dis=t==='build0'?[]:shuf(allToks.filter(w=>!set.has(norm(w)))).slice(0,who==='kid'?1:2);return{t:'build',es:p[1],ans:tk,tiles:shuf([...tk,...dis])}}
    if(t==='fill'||t==='karaoke'){const p=nP(x=>toks(x[0]).length>=3);const tk=toks(p[0]);let idx=tk.findIndex((w,i)=>i>0&&norm(w).length>=3);if(idx<0)idx=tk.findIndex(w=>norm(w).length>=2);if(idx<0)idx=0;
      const ans=tk[idx];const dis=shuf(allToks.filter(w=>norm(w)!==norm(ans)&&norm(w).length>=2)).slice(0,2);return{t,en:p[0],es:p[1],tk,idx,ans,opts:shuf([ans,...dis])}}
    if(t==='speak'){const p=nP();return{t,en:p[0],es:p[1]}}
  };
  const seq=who==='kid'
    ?(basic?['pic','hear','M','word','pic','M','speakw','hear','M','meaning','build0']
      :o.zone==='canciones'?['pic','karaoke','build','M','listen','karaoke','speak','M','pic','build','karaoke']:['pic','listen','build','M','meaning','fill','speak','M','pic','build','listen'])
    :['meaning','build','listen','M','fill','speak','pic','M','build','meaning','speak'];
  const minis=shuf(basic?['pop','mole','memory','catch','spell']:['pop','catch','memory','spell','mole']);let mi=0;
  L={...o,t0:Date.now(),l1,basic,q:seq.map(t=>t==='M'?{t:'M',g:minis[mi++%minis.length]}:make(t)),i:0,ok:0,bad:0,combo:0,done:0,stars:0,answered:false,built:[]};
  const rv=[...(st.weak||[])].sort((a,b)=>b.n-a.n).slice(0,l1?3:2).map(reviewEx).filter(Boolean);
  rv.forEach((r,i)=>L.q.splice(Math.min(1+i*4,L.q.length),0,r));
  showEx();
}
function stat(o){o.stats=o.stats||{a:0,o:0,days:{},zones:{},speak:0};return o.stats}
function dayOf(st,d){return st.days[d]=st.days[d]||{a:0,o:0,l:0,m:0}}
function statAns(e,ok){const st=stat(wStore()),d=dayOf(st,today()),zk=L.zone||L.region,z=st.zones[zk]=st.zones[zk]||{a:0,o:0};
  st.a++;d.a++;z.a++;if(ok){st.o++;d.o++;z.o++}if(e.t==='speak')st.speak++;save()}

function findW(k){for(const set of [B,K,REG])for(const p of Object.values(set)){const w=p.words.find(x=>x[1]===k);if(w)return[w,p]}return null}
function findP(k){for(const set of [B,K,REG])for(const p of Object.values(set)){const x=p.phrases.find(y=>y[0]===k);if(x)return[x,p]}return null}
const wStore=()=>L.who==='reader'?S.kids[kid].rd:L.who==='kid'?S.kids[kid]:S.adult;
function wKey(e){if(L.who==='reader'&&!e.w)return null;if(e.w)return{t:'w',k:e.w[1]};const k=e.t==='listen'?e.ans:e.t==='build'?e.ans.join(' '):e.en;return k?{t:'p',k}:null}
function markWeak(e,ok){
  const o=wStore(),key=wKey(e);if(!key)return;const f=o.weak.find(x=>x.k===key.k);
  if(!ok){if(f)f.n=Math.min(3,f.n+1);else o.weak.push({...key,n:2});o.weak=o.weak.slice(-40)}
  else{if(f){f.n--;if(f.n<=0)o.weak=o.weak.filter(x=>x!==f)}if(key.t==='w'&&o.known&&!o.known.includes(key.k))o.known.push(key.k)}
  save();
}
function reviewEx(x){

  const f=findP(x.k);if(!f)return null;const[ph,p]=f;return{t:'meaning',en:ph[0],ans:ph[1],rev:1,opts:shuf([ph[1],...shuf(p.phrases.filter(y=>y!==ph)).slice(0,2).map(y=>y[1])])};
}

function rEval(target,heard,vowel){
  const tw=rNorm(target).split(' ').filter(Boolean),hw=rNorm(heard).split(' ').filter(Boolean);
  if(vowel){const v=tw[0];const ok=hw.some(h=>h===v||h==='h'+v||h[0]===v||(h[0]==='h'&&h[1]===v));return{ok,marks:[ok],score:ok?1:0}}
  const used=new Set();const marks=tw.map(t=>{const i=hw.findIndex((h,j)=>!used.has(j)&&(h===t||(t.length>=4&&lev(h,t)<=1)||(t.length>=7&&lev(h,t)<=2)));if(i>=0){used.add(i);return true}return false});
  const score=marks.filter(Boolean).length/Math.max(1,tw.length);
  return{ok:score>=(tw.length>=4?.75:1),marks,score};
}
function rMic(){
  const e=L.q[L.i],SR=window.SpeechRecognition||window.webkitSpeechRecognition,h=$('#heard'),m=$('.mic');
  const fb='El micrófono no está disponible aquí. Un adulto puede escuchar y tocar ✅ o 🔁 abajo.';
  if(L.answered)return;if(!SR){h.textContent=fb;$('.judge').classList.add('hl');return}
  try{
    const r=new SR();r.lang='es-CO';r.interimResults=true;r.maxAlternatives=3;r.continuous=e.t==='rstory';
    let t0=0,final='',done=false;m.classList.add('rec');h.textContent='👂 Te escucho… lee con calma.';
    r.onstart=()=>{t0=Date.now()};
    r.onresult=ev=>{let txt='';for(const res of ev.results)txt+=res[0].transcript+' ';final=txt;h.textContent='👂 '+txt;
      const ev2=rEval(e.en,txt,e.vowel);$$('#rt .rw').forEach((s2,i)=>{if(ev2.marks[i])s2.classList.add('okw')});
      if(ev2.ok&&!done){done=true;try{r.stop()}catch(x){}rFinish(e,true,txt,t0)}};
    r.onerror=ev=>{m.classList.remove('rec');if(ev.error==='no-speech')h.textContent='No te escuché. Toca el micrófono y lee otra vez.';else{h.textContent=fb;$('.judge').classList.add('hl')}};
    r.onend=()=>{m.classList.remove('rec');if(!done&&final){done=true;const ev2=rEval(e.en,final,e.vowel);
      if(ev2.ok)return rFinish(e,true,final,t0);
      L.tries=(L.tries||0)+1;$$('#rt .rw').forEach((s2,i)=>s2.classList.toggle('badw',!ev2.marks[i]));
      if(L.tries>=3)return rFinish(e,false,final,t0);
      h.innerHTML=`Escuché: «${esc(final.trim())}». Las palabras en rojo hay que leerlas otra vez. <b>¡Intenta de nuevo!</b>`;talk([[ES,R(['Casi. Mira las palabras en rojo e intenta otra vez.','Vas muy bien. Lee otra vez con calma.'])]])}};
    r.start();
  }catch(err){h.textContent=fb;$('.judge').classList.add('hl')}
}

  <section class="dcard"><h3>Camino de lectura</h3>${RORD.map((z,i)=>{const p=RT[z],zs=st.zones[z]||{a:0,o:0},za=pctx(zs.o,zs.a),c=rd.zones[z]||0;return`<div class="trow ${i>ti?'lock':''}"><span class="te">${p.e}</span><span class="tn">${p.n}${i>ti?' 🔒':i<ti?' ✅':''}<small>${c} ${c===1?'lección':'lecciones'}${za!=null?' · '+za+'% aciertos':''}</small></span><div class="tbar"><i style="width:${i<ti?100:i===ti?(rd.done%2)*50:0}%"></i></div><b>${i<ti?'✓':i===ti?'ahora':''}</b></div>`}).join('')}</section>
  <section class="dcard"><h3>✅ Ya lee (${mastered.length})</h3><div class="wchips">${mastered.length?mastered.map(w=>`<span>${em(w)}${esc(w)}</span>`).join(''):'<p>Aún ninguna.</p>'}</div></section>
  <section class="dcard"><h3>🔁 Por repasar (${rd.weak.length})</h3><div class="wchips weak">${rd.weak.length?rd.weak.map(x=>`<span>${em(x.k)}${esc(x.k)}<u>${'●'.repeat(x.n)}</u></span>`).join(''):'<p>Nada pendiente. 🎉</p>'}</div></section>`;
}

function dashAdult(){
  const A=S.adult,st=stat(A),acc=pctx(st.o,st.a),d=dStage();
  if(!A.onb)return`<section class="dcard"><p>El perfil adulto todavía no se ha creado.</p></section>`;
  return`<section class="dgrid">
   <div class="dstat big"><small>Título</small><b style="font-size:26px">${esc(titleFor())}</b><span>${A.xp} XP</span></div>
   <div class="dstat"><small>Dragón</small><b>${d[1]}</b><span>${esc(d[2])}</span></div>
   <div class="dstat"><small>Aciertos</small><b>${acc!=null?acc+'%':'—'}</b><span>${st.a} respuestas</span></div>
   <div class="dstat"><small>Lecciones</small><b>${A.done}</b><span>🔥 ${A.streak} días de racha</span></div></section>
  <section class="dcard"><h3>Regiones</h3>${Object.entries(REG).map(([k,r])=>{const c=A.regions[k]||0,zs=st.zones[k],za=zs?pctx(zs.o,zs.a):null;return`<div class="trow"><span class="te">${r.e}</span><span class="tn">${r.n}<small>${za!=null?za+'% aciertos':'sin datos'}</small></span><div class="tbar"><i style="width:${Math.min(100,c/5*100)}%"></i></div><b>${c}</b></div>`}).join('')}</section>
  <section class="dcard"><h3>🔁 Por repasar (${A.weak.length})</h3><div class="wchips weak">${A.weak.map(x=>`<span>${esc(x.k)}</span>`).join('')||'<p>Nada pendiente.</p>'}</div></section>`;
}
